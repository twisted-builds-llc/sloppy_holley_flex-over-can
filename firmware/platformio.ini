; Sloppy Holley Flex-over-CAN firmware.
; Platform pinned to an exact pioarduino release (Arduino-ESP32 3.3.11, ESP-IDF 5.5.5).
; Change the URL only on purpose, and record it in docs/PROGRESS.md.

[platformio]
default_envs = c3

[env:c3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
test_ignore = test_holley

; Host unit tests for pure logic (src/holley.h). Run: pio test -e native
[env:native]
platform = native
build_flags = -std=gnu++17 -Isrc
